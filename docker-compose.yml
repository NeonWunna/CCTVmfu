services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-keep-alive 120
    container_name: cctv_backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cctv_db
      - PYTHONUNBUFFERED=1
      # Google OAuth - Load from .env file on server
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-f0db8a2984d6777d5e5f2048ed560f257b9b0b98bee58b8914aecc6dc2a53164}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      # Frontend URL for OAuth callback redirect
      - FRONTEND_URL=${FRONTEND_URL:-https://cctvmap.mfu.ac.th}
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - cctv-network

  db:
    image: postgres:15
    container_name: cctv_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cctv_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cctv-network

  frontend:
    build: ./frontend
    container_name: cctv_frontend
    networks:
      - cctv-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: cctv_nginx
    ports:
      - "8010:8010"
      - "8020:8020"
    depends_on:
      - backend
      - frontend
      - go2rtc
    networks:
      - cctv-network

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: cctv_go2rtc
    restart: always
    ports:
      - "1984:1984"
      - "8554:8554"
      - "8555:8555/tcp"
      - "8555:8555/udp"
    networks:
      - cctv-network

networks:
  cctv-network:
    driver: bridge

volumes:
  postgres_data:
