# go2rtc Configuration - Optimized for low-latency WebRTC
# yaml-language-server: $schema=https://raw.githubusercontent.com/AlexxIT/go2rtc/master/www/schema.json
#
# Version: v1.9.14
# Documentation: https://github.com/AlexxIT/go2rtc

api:
  listen: ":1984"

rtsp:
  listen: ":8554"
  default_query: "video&audio"

webrtc:
  listen: ":8555"

  # ICE Servers for NAT traversal (STUN + TURN)
  ice_servers:
    # --- Free STUN servers (discover public IP, no relay) ---
    - urls:
        - stun:stun.cloudflare.com:3478
        - stun:stun.l.google.com:19302
        - stun:stun1.l.google.com:19302
        - stun:stun2.l.google.com:19302

    # --- TURN server (relay traffic behind symmetric NAT) ---
    # Uncomment and configure if accessing from outside the LAN:
    # - urls: [turn:YOUR_TURN_SERVER_IP:3478]
    #   username: YOUR_TURN_USERNAME
    #   credential: YOUR_TURN_PASSWORD

  # WebRTC candidate — server's real LAN IP for direct UDP connections
  candidates:
    - 192.168.11.67:8555

log:
  level: "info"
  format: ""
